/**:
  ros__parameters:
    # all mavros 2.16 plugins, only the ones the HW API uses are enabled (each plugin is a node, costs CPU)
    # with standalone:=false (default), this list is always used, UAS params (plugin_allowlist, plugin_denylist) in a custom mavros_config are ignored
    plugin_allowlist:

      # mavros (core)
      # - actuator_control      # needed only for input_mode/control_group
      - altitude                # altitude
      - command                 # cmd/command (arming)
      # - ftp
      # - geofence
      - global_position         # global_position/global, global_position/compass_hdg
      # - home_position
      - imu                     # imu/data, imu/mag
      - local_position          # local_position/odom (always, also odometry/in with OLD_PX4_FW)
      # - manual_control
      # - nav_controller_output
      # - param
      # - rallypoint
      - rc_io                   # rc/in
      # - setpoint_accel
      # - setpoint_attitude
      # - setpoint_position
      - setpoint_raw            # setpoint_raw/attitude (attitude and attitude_rate cmds)
      # - setpoint_trajectory
      # - setpoint_velocity
      - sys_status              # state, extended_state, battery, set_mode
      - sys_time                # timesync, needed for correct message stamps
      # - waypoint
      # - wind_estimation

      # mavros_extras
      # - adsb
      # - cam_imu_sync
      # - camera
      # - cellular_status
      # - companion_process_status
      # - debug_value
      - distance_sensor         # garmin
      # - esc_status
      # - esc_telemetry
      # - fake_gps
      # - gimbal_control
      # - gps_input
      # - gps_rtk               # needed only when RTCM corrections are sent through mavros (gps_rtk/send_rtcm)
      - gps_status              # gpsstatus/gps
      # - guided_target
      # - hil
      # - landing_target
      # - log_transfer
      # - mag_calibration_status
      # - mocap_pose_estimate
      # - mount_control
      # - obstacle_distance
      # - obstacle_distance_3d
      - odometry                # odometry/in
      # - onboard_computer_status
      # - open_drone_id
      # - optical_flow
      # - play_tune
      # - px4flow
      # - rangefinder
      # - sim_state
      # - tdr_radio
      # - terrain
      # - trajectory
      # - tunnel
      # - vfr_hud
      # - vibration
      # - vision_pose
      # - vision_speed
      # - wheel_odometry
